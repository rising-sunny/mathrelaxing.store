<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MathRelaxing Pet Studio Login</title>
  <style>
    :root {
      --ink: #161616; --muted: #69706b; --paper: #eef0ea; --panel: #fffdf7;
      --line: #d8dacd; --accent: #0f6b57; --blue: #244a7a;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      background:
        radial-gradient(circle at 18% 16%, rgba(15, 107, 87, 0.16), transparent 34%),
        linear-gradient(140deg, rgba(36, 74, 122, 0.12), transparent 42%), var(--paper);
      color: var(--ink); font-family: Georgia, "Times New Roman", serif;
    }
    .card {
      width: min(460px, 100%); background: rgba(255, 253, 247, 0.92);
      border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 24px 80px rgba(22, 28, 24, 0.16); padding: 28px;
    }
    .eyebrow { margin: 0 0 10px; color: var(--accent);
      font: 700 12px/1.2 ui-monospace, Consolas, monospace; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 42px; line-height: 0.95; }
    p { color: var(--muted); line-height: 1.45; margin: 0 0 22px; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%; border: 1px solid var(--line); background: #fffefa; color: var(--ink);
      border-radius: 8px; padding: 12px; font: inherit; outline: none;
    }
    input:focus { border-color: rgba(36, 74, 122, 0.62);
      box-shadow: 0 0 0 3px rgba(36, 74, 122, 0.12); }
    button { min-height: 44px; border: 0; border-radius: 8px; background: var(--accent);
      color: white; font: inherit; cursor: pointer; }
    .error { color: #9e2638; border: 1px solid rgba(158, 38, 56, 0.25);
      background: rgba(158, 38, 56, 0.08); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">MathRelaxing internal tool</p>
    <h1>Pet Studio</h1>
    <p>Sign in to turn a customer's pet photo into a paint-by-numbers download bundle.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/pet/login">
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Open Pet Studio</button>
    </form>
  </main>
</body>
</html>
