<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MathRelaxing</title>
  <style>
    :root {
      --ink: #171417;
      --muted: #706975;
      --paper: #f5f2ee;
      --panel: #fffdf8;
      --line: #ddd5cc;
      --accent: #fe2c55;
      --accent-dark: #cc1f43;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(130deg, rgba(37, 244, 238, 0.14), transparent 35%),
        radial-gradient(circle at 82% 20%, rgba(254, 44, 85, 0.16), transparent 30%),
        var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: min(460px, 100%);
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(22, 18, 20, 0.16);
      padding: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font: 700 12px/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
      line-height: 0.95;
    }

    p {
      color: var(--muted);
      line-height: 1.45;
      margin: 0 0 22px;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffefa;
      color: var(--ink);
      border-radius: 7px;
      padding: 12px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: rgba(254, 44, 85, 0.55);
      box-shadow: 0 0 0 3px rgba(254, 44, 85, 0.11);
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: var(--accent-dark); }

    .error {
      color: #9e2638;
      border: 1px solid rgba(158, 38, 56, 0.25);
      background: rgba(158, 38, 56, 0.08);
      border-radius: 7px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">MathRelaxing internal tool</p>
    <h1>TikTok Login</h1>
    <p>Sign in to connect TikTok and upload MathRelaxing videos into the TikTok draft flow.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/tiktok/login">
      <label>
        Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Open TikTok Console</button>
    </form>
  </main>
</body>
</html>
