name: Deploy to VPS

# Deploy-on-push: whenever main updates, SSH into the Hetzner VPS and
# `git pull` + restart the service. Can also be run by hand from the
# Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once; let an in-flight one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
              "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/mathrelaxing.store
          echo "== git pull =="
          git pull --ff-only origin main
          echo "== restart service =="
          systemctl restart mathrelaxing.service
          # warmup-aware health check (first request can 502 for 5-15s)
          ok=0
          for i in $(seq 1 6); do
            sleep 4
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then ok=1; break; fi
          done
          if [ "$ok" = 1 ]; then
            echo "== healthy, deploy complete =="
          else
            echo "== service did NOT become healthy =="
            systemctl status --no-pager mathrelaxing.service | tail -20 || true
            exit 1
          fi
          REMOTE
